name: fresh-machine

# Models a brand-new student computer on all three platforms. Every runner is a throwaway
# machine, and kmc runs in an empty folder with an empty sign-in home, so "it works on my
# machine" cannot hide anything here. What it cannot cover is the emailed code: nobody
# reads an inbox on a runner, so the sign-in itself is proved by hand.

on:
  push:
  workflow_dispatch:
  # kmc and Krista's server change without a push here, so a broken first run would otherwise
  # wait for the next edit to this repo to show up.
  schedule:
    - cron: "17 12 * * *"

env:
  SKILL: plugins/boss-install/skills/install-my-boss/SKILL.md
  KMC_URL: https://kmc-os-server.vercel.app/kmc

jobs:
  install-path:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spread across ages and architectures, not just "latest": macos-15 is Apple
        # silicon (macos-14 was dropped on 2026-11-23: GitHub no longer runs it, and a red
        # job that means nothing is worse than none), windows-2022 is what a computer
        # bought a few years ago still runs, ubuntu-22.04 stands in for older Linux and
        # Chromebook containers.
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15,
             windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: The download address in the skill is the real one, and answers
        shell: bash
        run: |
          grep -q "$KMC_URL" "$SKILL" || { echo "::error::the skill no longer names $KMC_URL"; exit 1; }
          C=$(curl -s -o /dev/null -w '%{http_code}' "$KMC_URL")
          [ "$C" = 200 ] || { echo "::error::$KMC_URL answered HTTP $C"; exit 1; }
          echo "kmc is served: HTTP $C"

      - name: Bring kmc down into an empty BOSS-OS folder and run it, as the skill does
        shell: bash
        run: |
          set -u
          HOME_DIR="$RUNNER_TEMP/student"
          FOLDER="$HOME_DIR/Sites/BOSS-OS"
          mkdir -p "$FOLDER"
          cd "$FOLDER"
          # Windows: the skill uses curl.exe, which ships with Windows 10 and 11.
          if [ "$RUNNER_OS" = Windows ]; then curl.exe -fsSL -o kmc "$KMC_URL"; else curl -fsSL -o kmc "$KMC_URL"; fi
          set +e
          OUT=$(KMCOS_HOME="$HOME_DIR/.kmc-os" bash kmc whoami 2>&1); CODE=$?
          set -e
          echo "$OUT"
          echo "exit $CODE"
          # First run: it moves itself into .claude/scripts and says this computer is not
          # signed in (exit 4). Anything else on a fresh machine is a broken install.
          [ -f .claude/scripts/kmc ] || { echo "::error::kmc did not move itself to .claude/scripts/kmc"; exit 1; }
          [ ! -f kmc ] || { echo "::error::kmc left a copy in the folder root"; exit 1; }
          [ "$CODE" = 4 ] || { echo "::error::expected 'not signed in' (exit 4), got exit $CODE"; exit 1; }
          echo "$OUT" | grep -q "isn't signed in" || { echo "::error::kmc did not say this computer isn't signed in"; exit 1; }
          # And from its real place, the way every later step runs it.
          set +e
          KMCOS_HOME="$HOME_DIR/.kmc-os" bash .claude/scripts/kmc whoami > /dev/null 2>&1; AGAIN=$?
          set -e
          [ "$AGAIN" = 4 ] || { echo "::error::kmc from .claude/scripts answered exit $AGAIN"; exit 1; }
          echo "kmc runs on $RUNNER_OS from an empty folder, and asks for a sign-in"

      - name: From PowerShell on Windows, the way a student's Claude may run it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The skill: curl.exe (plain curl is something else in PowerShell), and Git's own bash
          # found beside git.exe, then Program Files, then the per-user place; never a bare
          # bash, which on Windows can be WSL's.
          $folder = Join-Path $env:RUNNER_TEMP "ps-student\Sites\BOSS-OS"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Set-Location $folder
          curl.exe -fsSL -o kmc $env:KMC_URL
          if ($LASTEXITCODE -ne 0) { Write-Error "curl.exe could not fetch kmc"; exit 1 }
          $bash = $null
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) { $c = Join-Path (Split-Path (Split-Path $git.Source -Parent) -Parent) "bin\bash.exe"; if (Test-Path $c) { $bash = $c } }
          foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe")) { if (-not $bash -and (Test-Path $c)) { $bash = $c } }
          if (-not $bash) { Write-Error "no Git bash found the way the skill looks for it"; exit 1 }
          Write-Output "Git's bash: $bash"
          $env:KMCOS_HOME = Join-Path $env:RUNNER_TEMP "ps-student\.kmc-os"
          $out = & $bash kmc whoami 2>&1
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 4) { Write-Error "expected 'not signed in' (exit 4), got exit $code"; exit 1 }
          if (-not (Test-Path ".claude\scripts\kmc")) { Write-Error "kmc did not move itself into place"; exit 1 }
          & $bash .claude/scripts/kmc whoami *> $null
          if ($LASTEXITCODE -ne 4) { Write-Error "kmc from .claude/scripts answered exit $LASTEXITCODE"; exit 1 }
          Write-Output "kmc runs from PowerShell through Git's bash, with a path that has a space in it"

      - name: Manifests must be valid on every platform
        shell: bash
        run: |
          python3 -c "import json;[json.load(open(p)) for p in ['.claude-plugin/marketplace.json','plugins/boss-install/.claude-plugin/plugin.json']];print('manifests parse')"
          test -f "$SKILL" || { echo "::error::skill missing"; exit 1; }
          grep -q '^name: install-my-boss$' "$SKILL" || { echo "::error::skill name changed"; exit 1; }

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No admin, no password, anywhere in the skill
        run: |
          FAIL=0
          # Instructions, not mentions: the skill names Homebrew and sudo to forbid them.
          if grep -nE '(^|[`( ])sudo [a-z]' "$SKILL"; then echo "::error::skill appears to invoke sudo"; FAIL=1; fi
          if grep -nE 'brew install|install Homebrew|via Homebrew|using Homebrew' "$SKILL"; then
            echo "::error::skill appears to route through Homebrew"; FAIL=1; fi
          if grep -niE 'ask (them |her |the student )?for (their |her )?(computer |login )?password' "$SKILL" \
             | grep -viE 'never|do not|don.t'; then echo "::error::skill appears to ask for a password"; FAIL=1; fi
          grep -q 'Homebrew is never the answer' "$SKILL" || { echo "::error::the no-Homebrew statement was removed"; FAIL=1; }
          exit $FAIL

      - name: GitHub is gone from the install, and stays gone
        run: |
          # The point of this install. The skill may say GitHub is not used; it must never
          # install the GitHub tool, sign anyone in to GitHub, or hand out the old form.
          FAIL=0
          if grep -nE 'gh auth|GitHub\.cli|cli/cli/releases|github\.com/login/device|/get-boss|Bash\(gh:' "$SKILL"; then
            echo "::error::the GitHub sign-in or the form is back in the skill"; FAIL=1; fi
          grep -q 'Never ask her to make or sign in to a GitHub account' "$SKILL" \
            || { echo "::error::the no-GitHub rule was removed"; FAIL=1; }
          exit $FAIL

      - name: Copy blocks must never be language-tagged
        run: |
          # A ```bash block gets a Run button in the desktop app. The folder path is shown in
          # a fenced block so it gets a COPY button; tagging it makes it something to Run.
          # Fences inside a blockquote ("> ```") count too: the path block is one.
          if grep -nE '^\s*(>\s*)?```(bash|sh|shell|console|powershell|pwsh)\s*$' "$SKILL"; then
            echo "::error::a language-tagged fence exists; it would render a Run button"; exit 1; fi
          grep -q 'Never tag that block' "$SKILL" || { echo "::error::the untagged-path rule was removed"; exit 1; }

      - name: The handoff opens her folder, in place, and runs the setup there
        run: |
          FAIL=0
          # Every value start_session needs to actually start, rather than show a card that waits.
          for want in '`initiation`: `"user_asked"`' '`context`: `"fresh"`' '`use_worktree`: `false`' \
                      '`prompt`: `"set up my OS"`' '`title`: `"Set up my BOSS"`' '`background`: `"' '`cwd`:'; do
            grep -qF "$want" "$SKILL" || { echo "::error::the start_session call lost $want"; FAIL=1; }
          done
          grep -q 'Never start her setup in this session' "$SKILL" || { echo "::error::the stop-here rule was removed"; FAIL=1; }
          grep -q 'never for this one' "$SKILL" || { echo "::error::kmc install's 'Next: run setup' line is no longer handled"; FAIL=1; }
          exit $FAIL

      - name: A Mac's stand-in git is never run
        run: |
          FAIL=0
          grep -q "Never run a Mac's \`git\` before \`xcode-select -p\` answers" "$SKILL" || { echo "::error::the Mac stand-in rule was removed"; FAIL=1; }
          if grep -nE 'Poll until `git --version`' "$SKILL"; then echo "::error::polling git on a Mac reopens Apple's installer"; FAIL=1; fi
          exit $FAIL

      - name: Nobody is routed to office hours, a coach or the academy
        run: |
          # Students who install this way are not all in the Academy (Jerry, 2026-11-19). Help
          # ends on bosssupport@kristamashore.com.
          if grep -niE 'office hours|group call|facebook group|your coach|academy' "$SKILL"; then
            echo "::error::the skill routes students somewhere not every student has"; exit 1; fi
          grep -q 'bosssupport@kristamashore.com' "$SKILL" || { echo "::error::the support address is gone"; exit 1; }
