name: fresh-machine

# Models a brand-new student computer on all three platforms. Every runner is a throwaway
# machine, and kmc runs in an empty folder with an empty sign-in home, so "it works on my
# machine" cannot hide anything here. What it cannot cover is the emailed code: nobody
# reads an inbox on a runner, so the sign-in itself is proved by hand.

on:
  push:
  workflow_dispatch:
  # kmc and Krista's server change without a push here, so a broken first run would otherwise
  # wait for the next edit to this repo to show up.
  schedule:
    - cron: "17 12 * * *"

env:
  PROMPT: install-prompt.txt
  KMC_URL: https://kmc-os-server.vercel.app/kmc

jobs:
  install-path:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spread across ages and architectures, not just "latest": macos-15 is Apple
        # silicon (macos-14 was dropped on 2026-11-23: GitHub no longer runs it, and a red
        # job that means nothing is worse than none), windows-2022 is what a computer
        # bought a few years ago still runs, ubuntu-22.04 stands in for older Linux and
        # Chromebook containers.
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15,
             windows-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: The download address in the paste is the real one, and answers
        shell: bash
        run: |
          grep -q "$KMC_URL" "$PROMPT" || { echo "::error::the paste no longer names $KMC_URL"; exit 1; }
          C=$(curl -s -o /dev/null -w '%{http_code}' "$KMC_URL")
          [ "$C" = 200 ] || { echo "::error::$KMC_URL answered HTTP $C"; exit 1; }
          echo "kmc is served: HTTP $C"

      - name: Bring kmc down into an empty BOSS-OS folder and run it, as the paste does
        shell: bash
        run: |
          set -u
          HOME_DIR="$RUNNER_TEMP/student"
          FOLDER="$HOME_DIR/Sites/BOSS-OS"
          mkdir -p "$FOLDER"
          cd "$FOLDER"
          # Windows: the skill uses curl.exe, which ships with Windows 10 and 11.
          if [ "$RUNNER_OS" = Windows ]; then curl.exe -fsSL -o kmc "$KMC_URL"; else curl -fsSL -o kmc "$KMC_URL"; fi
          set +e
          OUT=$(KMCOS_HOME="$HOME_DIR/.kmc-os" bash kmc whoami 2>&1); CODE=$?
          set -e
          echo "$OUT"
          echo "exit $CODE"
          # First run: it moves itself into .claude/scripts and says this computer is not
          # signed in (exit 4). Anything else on a fresh machine is a broken install.
          [ -f .claude/scripts/kmc ] || { echo "::error::kmc did not move itself to .claude/scripts/kmc"; exit 1; }
          [ ! -f kmc ] || { echo "::error::kmc left a copy in the folder root"; exit 1; }
          [ "$CODE" = 4 ] || { echo "::error::expected 'not signed in' (exit 4), got exit $CODE"; exit 1; }
          echo "$OUT" | grep -q "isn't signed in" || { echo "::error::kmc did not say this computer isn't signed in"; exit 1; }
          # And from its real place, the way every later step runs it.
          set +e
          KMCOS_HOME="$HOME_DIR/.kmc-os" bash .claude/scripts/kmc whoami > /dev/null 2>&1; AGAIN=$?
          set -e
          [ "$AGAIN" = 4 ] || { echo "::error::kmc from .claude/scripts answered exit $AGAIN"; exit 1; }
          echo "kmc runs on $RUNNER_OS from an empty folder, and asks for a sign-in"

      - name: What kmc tells the AI to tell the student, on this computer
        shell: bash
        run: |
          set -u
          HOME_DIR="$RUNNER_TEMP/student"
          KMC="$HOME_DIR/Sites/BOSS-OS/.claude/scripts/kmc"
          # Asking for a code: what to do if it never arrives (the server sends nothing to an
          # address without access, and says so the same way either way).
          OUT=$(KMCOS_HOME="$HOME_DIR/.kmc-os" bash "$KMC" login ci-fresh-machine@example.com 2>&1); CODE=$?
          echo "$OUT"
          [ "$CODE" = 0 ] || { echo "::error::asking for a code answered exit $CODE"; exit 1; }
          echo "$OUT" | grep -q "check their spam folder" || { echo "::error::no spam advice after asking for a code"; exit 1; }
          echo "$OUT" | grep -q "bosssupport@kristamashore.com" || { echo "::error::no support address after asking for a code"; exit 1; }
          # A folder that already holds someone's things: nothing is installed, and the AI asks.
          BUSY="$RUNNER_TEMP/busy/Sites/BOSS-OS"
          mkdir -p "$BUSY/.claude/scripts" && cp "$KMC" "$BUSY/.claude/scripts/kmc" && echo notes > "$BUSY/My Notes.txt"
          set +e
          OUT=$(cd "$BUSY" && KMCOS_HOME="$HOME_DIR/.kmc-os" bash .claude/scripts/kmc install 2>&1); CODE=$?
          set -e
          echo "$OUT"
          [ "$CODE" = 1 ] || { echo "::error::a busy folder answered exit $CODE"; exit 1; }
          echo "$OUT" | grep -q "My Notes.txt" || { echo "::error::kmc did not name what is in the folder"; exit 1; }
          echo "$OUT" | grep -q "ask the student whether this is the right folder" || { echo "::error::kmc did not say to ask"; exit 1; }
          [ ! -e "$BUSY/CLAUDE.md" ] || { echo "::error::kmc installed into a busy folder"; exit 1; }
          echo "kmc's sign-in and folder messages are right on $RUNNER_OS"

      - name: From PowerShell on Windows, the way a student's Claude may run it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # If Claude runs PowerShell: curl.exe (plain curl is something else in PowerShell), and Git's own bash
          # found beside git.exe, then Program Files, then the per-user place; never a bare
          # bash, which on Windows can be WSL's.
          $folder = Join-Path $env:RUNNER_TEMP "ps-student\Sites\BOSS-OS"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Set-Location $folder
          curl.exe -fsSL -o kmc $env:KMC_URL
          if ($LASTEXITCODE -ne 0) { Write-Error "curl.exe could not fetch kmc"; exit 1 }
          $bash = $null
          $git = Get-Command git -ErrorAction SilentlyContinue
          if ($git) { $c = Join-Path (Split-Path (Split-Path $git.Source -Parent) -Parent) "bin\bash.exe"; if (Test-Path $c) { $bash = $c } }
          foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe")) { if (-not $bash -and (Test-Path $c)) { $bash = $c } }
          if (-not $bash) { Write-Error "no Git bash found the way the skill looks for it"; exit 1 }
          Write-Output "Git's bash: $bash"
          $env:KMCOS_HOME = Join-Path $env:RUNNER_TEMP "ps-student\.kmc-os"
          $out = & $bash kmc whoami 2>&1
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 4) { Write-Error "expected 'not signed in' (exit 4), got exit $code"; exit 1 }
          if (-not (Test-Path ".claude\scripts\kmc")) { Write-Error "kmc did not move itself into place"; exit 1 }
          & $bash .claude/scripts/kmc whoami *> $null
          if ($LASTEXITCODE -ne 4) { Write-Error "kmc from .claude/scripts answered exit $LASTEXITCODE"; exit 1 }
          Write-Output "kmc runs from PowerShell through Git's bash, with a path that has a space in it"
          # kmc's own "not signed in" (4) is still in $LASTEXITCODE, which the runner would report.
          exit 0


  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The paste keeps every step, in order
        run: |
          FAIL=0
          need() { grep -qF "$1" "$PROMPT" || { echo "::error::the paste lost: $1"; FAIL=1; }; }
          need "BOSS-OS inside my Sites folder"
          need "$KMC_URL"
          need "bash kmc whoami"
          need "kmc login"
          need "the email address I bought with"
          need "kmc install"
          need "Start a new session in that BOSS-OS folder itself, not a copy of it"
          need "bring it up on my screen"
          need "named Set up my BOSS"
          need "If BOSS-OS is already there, use it"
          need "I am asking you to start it"
          need "curl -fsSL"
          need "set up my OS"
          need "If you can't, tell me the folder's full path"
          # Windows without Git: BOSS needs Git's bash, and Claude finds Git in Program Files
          # by itself, so it is installed there (windows-no-git.yml proves it).
          need "On Windows only: if Git for Windows is not installed, install it for me first"
          need "winget install --id Git.Git -e --silent"
          need "use Git's bash.exe for every bash step below"
          need "tell me to click Yes"
          exit $FAIL

      - name: Nothing in the paste sends her to GitHub, Terminal or her password
        run: |
          FAIL=0
          if grep -niE 'github|gh auth|/get-boss|invitation' "$PROMPT"; then echo "::error::GitHub or the form is back in the paste"; FAIL=1; fi
          grep -qF "Never ask me to open Terminal, paste a command, or type my computer password" "$PROMPT" \
            || { echo "::error::the no-Terminal, no-password line was removed"; FAIL=1; }
          if grep -nE 'sudo |brew install' "$PROMPT"; then echo "::error::the paste asks for admin rights"; FAIL=1; fi
          exit $FAIL

      - name: It stays short
        run: |
          # Longer pastes were stopped more often in testing (README). A new step has to earn it,
          # and what Claude tells the student along the way belongs in kmc's own output instead.
          # 400 since the Windows Git step (Opus went straight through 10 of 10 with it).
          W=$(wc -w < "$PROMPT"); echo "$W words"
          [ "$W" -le 400 ] || { echo "::error::the paste grew to $W words"; exit 1; }
